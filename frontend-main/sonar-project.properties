sonar.projectKey=google-photo-frontend
sonar.projectName=Google Photo Frontend
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.jsx,**/*.spec.ts,**/*.spec.tsx,**/public/**,**/*.config.js,**/*.config.ts,**/vite-env.d.ts,**/*.stories.jsx,**/*.stories.tsx

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js

# TypeScript support (safe to keep even in a JS-only project; ignored if unused)
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Duplication exclusions (JSX markup and generated boilerplate trigger noisy false positives)
sonar.cpd.exclusions=**/components/ui/**,**/assets/**

# Optional: wait for quality gate result within the scan step itself
sonar.qualitygate.wait=true