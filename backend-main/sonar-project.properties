sonar.projectKey=google-photo-backend
sonar.projectName=Google Photo Backend
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.test.js,**/*.spec.js,**/coverage/**

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js

# Duplication exclusions (route/controller boilerplate often triggers false positives)
sonar.cpd.exclusions=**/routes/**,**/migrations/**

# Optional: fail fast if quality gate isn't met (usually handled in CI action instead)
sonar.qualitygate.wait=true