apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - cronJob.yaml
  - serviceAccount.yaml
  - EBSstorageClass.yaml

namespace: siddharth

patches:
  - target:
      kind: StatefulSet
      name: mongodb
    patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: ebs-gp3
